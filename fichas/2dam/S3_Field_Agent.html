<style>
:root{
  /* Liquid glass sobre aurora azul-turquesa-violeta (un solo mundo claro, como la secuencia de SMR).
     Layout: columna única móvil primero; cabecera + live briefing + agenda + tarjetas de actividad. */
  --ink:#0d1b33; --ink-soft:#3c4c6b; --accent:#0a5cff; --ok:#0f8a5f; --bad:#c2334d;

  color-scheme:light;
}
*{box-sizing:border-box}

  radial-gradient(55vw 45vw at 70% 70%,#b9a4ff 0%,transparent 62%),radial-gradient(50vw 40vw at 10% 85%,#8ff1c4 0%,transparent 60%),linear-gradient(160deg,#e6efff,#f2f7ff 50%,#e4ecff);
  background-attachment:fixed}
#app{max-width:860px;margin:0 auto;padding:18px 16px 70px;display:grid;gap:18px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--edge);border-radius:26px;

.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,0) 38%,rgba(255,255,255,0) 70%,rgba(255,255,255,.2))}

.btn.primary{background:var(--accent);color:#fff;border-color:rgba(255,255,255,.4)}
