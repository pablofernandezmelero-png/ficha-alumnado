<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>[hidden]{display:none!important}
:root{--ink:#0d1b33;--soft:#3c4c6b;--accent:#0a5cff;--ok:#0f8a5f;--bad:#c2334d;--glass:rgba(255,255,255,.5);--gs:rgba(255,255,255,.72);--edge:rgba(255,255,255,.82);
--display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;--body:"Figtree",-apple-system,"Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
--cl:#2f6bff;--ce:#0f9e8c;--eo:#ff7a1a;--ee:#8a4dff;--lex:#3f7d20;--ex:#5b6b8c;--hook:#b88a00;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--body);color:var(--ink);line-height:1.5;font-size:16px;background:#dfe9ff;
background-image:radial-gradient(60vw 50vw at 8% 4%,#7fb2ff 0%,transparent 60%),radial-gradient(45vw 40vw at 92% 12%,#6ff0de 0%,transparent 60%),radial-gradient(55vw 45vw at 70% 70%,#b9a4ff 0%,transparent 62%),radial-gradient(50vw 40vw at 10% 85%,#8ff1c4 0%,transparent 60%),linear-gradient(160deg,#e6efff,#f2f7ff 50%,#e4ecff);background-attachment:fixed}
#app{max-width:1000px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 80px;display:grid;gap:16px}
#app>*{min-width:0}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--edge);border-radius:26px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 18px 44px -20px rgba(20,50,120,.35);position:relative;padding:20px}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,0) 38%,rgba(255,255,255,0) 70%,rgba(255,255,255,.2))}
.glass>*{position:relative}
h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(1.9rem,6vw,2.8rem);line-height:1.05}h2{font-size:1.4rem}h3{font-size:1.1rem}
p{margin:0 0 8px}.small{font-size:.86rem;color:var(--soft)}
.eyebrow{font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);font-weight:600;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;font-size:.76rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--gs);border:1px solid var(--edge);white-space:nowrap}
.chip.k{color:#fff;background:var(--c);border-color:rgba(255,255,255,.5)}
.chip.xp{background:rgba(10,92,255,.12);color:var(--accent)}.chip.b2{background:var(--ee);color:#fff}.chip.cefr{background:var(--ink);color:#fff}
.top{display:grid;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar{height:10px;border-radius:99px;background:rgba(13,27,51,.1);overflow:hidden;flex:1 1 140px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#0f9e8c);transition:width .4s}
.sync{font-size:.8rem;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.6)}
.sync.ok{color:var(--ok)}.sync.err{color:var(--bad)}.sync.local{color:#7a5a00;background:rgba(255,236,170,.75)}
.nav{position:sticky;top:8px;z-index:6;padding:8px;display:flex;gap:6px;overflow-x:auto;border-radius:999px;scrollbar-width:none}
.nav a{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 6px;border-radius:999px;text-decoration:none;color:var(--ink);white-space:nowrap;font-weight:600;font-size:.84rem}
.nav a b{display:grid;place-items:center;min-width:24px;height:24px;border-radius:50%;background:var(--c,var(--accent));color:#fff;font-size:.74rem;padding:0 4px}
.nav a.done b{background:var(--ok)}
.act{scroll-margin-top:80px;display:grid;gap:10px}
.ah{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 12px;align-items:flex-start}
.ah h2{display:flex;gap:10px;align-items:center}
.ah h2 .n{display:grid;place-items:center;width:34px;height:34px;border-radius:12px;background:var(--c,var(--accent));color:#fff;font-size:1rem;flex:none}
.instr{font-size:1.02rem;max-width:68ch;margin:0}
details.es summary{display:inline-block;cursor:pointer;font-size:.74rem;font-weight:700;padding:1px 8px;border-radius:99px;background:rgba(13,27,51,.08)}
details.es p{font-size:.9rem;color:var(--soft);margin:6px 0 0}
.story{background:linear-gradient(120deg,rgba(255,236,170,.65),rgba(255,255,255,.4))}
.story p{font-size:1.05rem;max-width:68ch}
.item{border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.58);border-radius:16px;padding:10px 12px;position:relative;margin:0}
fieldset.item legend{font-weight:600;padding:0 4px;max-width:100%}
.item.ok{border-color:rgba(15,138,95,.6);background:rgba(220,247,234,.75)}
.item.bad{border-color:rgba(194,51,77,.6);background:rgba(255,228,233,.78)}
.mk{position:absolute;top:8px;right:10px;font-weight:800}.item.ok .mk{color:var(--ok)}.item.bad .mk{color:var(--bad)}
.key{display:block;margin-top:6px;font-size:.88rem;font-weight:600;color:var(--ok)}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.opt{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.8);border:1px solid rgba(13,27,51,.14);cursor:pointer}
.opt:has(input:checked){background:rgba(10,92,255,.15);border-color:var(--accent)}
input[type=text],select,textarea{font:inherit;color:var(--ink);background:rgba(255,255,255,.9);border:1px solid rgba(13,27,51,.22);border-radius:12px;padding:6px 10px;max-width:100%}
textarea{width:100%;resize:vertical;min-height:110px;line-height:1.45}
.gap{line-height:2.3}
.btn{font:inherit;font-weight:700;font-size:.92rem;cursor:pointer;padding:9px 16px;border-radius:999px;border:1px solid var(--edge);background:var(--gs);color:var(--ink);box-shadow:inset 0 1px 0 #fff}
.btn.p{background:var(--accent);color:#fff;border-color:rgba(255,255,255,.4)}
.btn.sm{padding:4px 11px;font-size:.82rem}
.btn[disabled]{opacity:.42;cursor:not-allowed;filter:grayscale(.6)}
.btn.rec{background:#c2334d;color:#fff}
.fb{font-weight:700;margin:0}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.help{font-size:.84rem;color:var(--soft)}
.pre{border:1px dashed rgba(10,92,255,.5);border-radius:18px;padding:12px 14px;background:rgba(232,240,255,.6)}
.reading{border-radius:20px;background:rgba(255,255,255,.88);border:1px solid #fff;padding:14px 18px}
.reading.proj{position:fixed;inset:0;z-index:50;overflow:auto;margin:0;border-radius:0;padding:4vh 6vw;background:#fffdf7}
.reading.proj .rd{font-size:clamp(1.25rem,2.3vw,2rem);max-width:1100px;margin:0 auto}
.rd table{border-collapse:collapse;width:100%;font-size:.92em}.rd th,.rd td{border:1px solid #c9d6e6;padding:4px 7px;text-align:left;vertical-align:top}.rd th{background:#e9f3fb}
.rd .doc{border:2px solid #2f6bb0;border-radius:10px;padding:10px 12px;background:#fff}
.rd h4{font-family:var(--display);margin:4px 0 8px;color:#174a8b}
.tw{overflow-x:auto}
.wcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px;align-items:start}
.wcard{background:rgba(255,255,255,.8);border:1px solid #fff;border-radius:16px;padding:8px 12px}
.wcard summary{cursor:pointer;display:flex;justify-content:space-between;gap:6px;align-items:center}
.wcard summary b{font-family:var(--display);font-size:1.1rem;color:var(--lex)}
.wcard dl{display:grid;gap:2px;margin:6px 0 0;font-size:.9rem}.wcard dt{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--soft);margin-top:4px}.wcard dd{margin:0}
.shrow{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid rgba(13,27,51,.08)}
.shline{font-size:1.05rem;margin:0}.shline b{color:#b44b00;text-decoration:underline;text-underline-offset:3px}
audio{width:100%;max-width:100%}audio.mini{height:34px;width:auto;max-width:100%}
video{width:100%;max-height:70vh;border-radius:14px;background:#000}
video.tall{max-width:380px;display:block;margin:0 auto}
.cuebox{padding:10px 14px;border-radius:14px;background:#0d1b33;color:#fff;font-weight:600}
.yt{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#0d1b33;max-width:100%}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.code{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.code input{font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;width:12ch}
.b2{background:linear-gradient(125deg,rgba(138,77,255,.22),rgba(255,255,255,.5))}
.live{background:linear-gradient(125deg,rgba(10,92,255,.16),rgba(255,255,255,.5))}
.tkey{display:none}body.teacher .tkey{display:block;margin-top:8px;padding:8px 12px;border-radius:12px;background:rgba(255,236,170,.85);font-size:.88rem}
.overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(13,27,51,.25);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.overlay .glass{width:min(440px,100%);display:grid;gap:8px}
#toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,140px);z-index:60;padding:10px 18px;border-radius:999px;background:#0d1b33;color:#fff;font-weight:600;transition:transform .3s;max-width:92vw}
#toast.on{transform:translate(-50%,0)}
.lb{display:grid;gap:4px}.lb div{display:flex;justify-content:space-between;padding:4px 10px;border-radius:10px;background:rgba(255,255,255,.55)}
.tech{background:rgba(138,77,255,.08);border:1px solid rgba(138,77,255,.3);border-radius:18px;padding:10px 14px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
@media(max-width:520px){.glass{padding:15px;border-radius:22px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.ytcard{display:flex;gap:14px;align-items:center;text-decoration:none;color:#fff;padding:16px 18px;border-radius:20px;background:linear-gradient(135deg,#c4302b,#7a1410);box-shadow:0 14px 30px -16px rgba(122,20,16,.8)}
.ytcard .play{flex:none;display:grid;place-items:center;width:54px;height:54px;border-radius:16px;background:#fff;color:#c4302b;font-size:1.4rem}
.ytcard b{display:block;font-family:var(--display);font-size:1.05rem}.ytcard small{opacity:.9}
